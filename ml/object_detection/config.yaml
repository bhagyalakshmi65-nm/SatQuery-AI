# =====================================================================
# SATQuery AI - Object Detection Configuration (YOLO11 / xView)
# Module: ml/object_detection
# =====================================================================

inference:
  confidence_threshold: 0.35  # Configurable confidence threshold for production inferences
  imgsz: 640
  max_det: 1089
  line_width: 2
  box_color: "#06B6D4"        # High-contrast cyan border for building footprints

dataset:
  name: "xView_full"
  # Read-only source paths on external drive R:
  raw_images_dir: "R:/SatQuery-AI/train_images/train_images"
  raw_geojson_path: "R:/SatQuery-AI/Xview_data/labels/xView_train.geojson"
  
  # Local destination for processed YOLO tiles and labels (Git-ignored)
  processed_dir: "ml/object_detection/data/processed"
  dataset_yaml_path: "ml/object_detection/data/processed/dataset.yaml"

# Sliding-Window Tiling Parameters
tiling:
  tile_size: 640              # Tile dimensions in pixels (640x640)
  overlap: 0.2                # Overlap fraction (20% -> step size 512 px)
  min_area_ratio: 0.3         # Keep clipped boxes if retained area >= 30% of original
  empty_tile_retention: 0.1   # Retain 10% of pure background tiles to prevent FP imbalance
  tile_format: "jpg"          # Tile image format ("jpg" or "png")
  jpg_quality: 95             # JPEG compression quality

# Scene-Level Partition (Guarantees zero spatial data leakage between splits)
# Automatic full-dataset scene discovery and deterministic 80/20 train/val split
scenes:
  train_ratio: 0.8            # 80% train, 20% validation
  seed: 42                    # Fixed random seed for deterministic splitting

# =====================================================================
# Extensible Multi-Class Mapping Architecture
# Primary Target: Buildings (xView type_id 73 -> YOLO class 0)
# All other 59 official xView classes preserved with contiguous IDs 1..59
# =====================================================================
primary_target:
  name: "building"
  xview_id: 73
  yolo_id: 0

# Full multi-class mapping dictionary (xview_type_id -> {name, yolo_id})
classes:
  # Primary Target
  73: { name: "building", yolo_id: 0 }

  # Aircraft
  11: { name: "fixed_wing_aircraft", yolo_id: 1 }
  12: { name: "small_aircraft", yolo_id: 2 }
  13: { name: "cargo_plane", yolo_id: 3 }
